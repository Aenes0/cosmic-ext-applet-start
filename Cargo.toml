[package]
name = "cosmic-ext-applet-start"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Windows 11 style Start menu for COSMIC: search, pinned, recommended and all apps, open windows"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
image = { version = "0.25.9", default-features = false }
libc = "0.2"
shlex = "1.3"
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "dbus-config",
    "desktop",
    "desktop-systemd-scope",
    "multi-window",
    "tokio",
    "wayland",
    "wgpu",
    "winit",
] }
memmap2 = "0.9.10"
resvg = "=0.45.1"
rustix = { version = "1.1", features = ["fs"] }
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
zbus = { version = "5.14.0", default-features = false, features = ["tokio", "p2p"] }

[dev-dependencies]
iced_tiny_skia = { git = "https://github.com/pop-os/libcosmic" }

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"

# Same pins as cosmic-applets epoch-1.8.0, to match the installed panel.
[patch."https://github.com/smithay/client-toolkit.git"]
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

[patch."https://github.com/pop-os/cosmic-protocols"]
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "32283d7" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "32283d7" }

# Patched tiny-skia renderer (damage bounding box, cheaper clip mask). The
# directory is generated by scripts/libcosmic-patched.sh from the patches in
# third_party/libcosmic-patches; run it before building. Only this crate is
# replaced: the others keep coming from the libcosmic git source in Cargo.lock.
[patch."https://github.com/pop-os/libcosmic"]
iced_tiny_skia = { path = "../libcosmic-patched/iced/tiny_skia" }
