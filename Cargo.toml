[package]
name = "cosmic-ext-applet-start"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Windows 11 style Start menu for COSMIC: search, pinned, recommended and all apps, open windows"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
libc = "0.2"
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "dbus-config",
    "desktop",
    "desktop-systemd-scope",
    "multi-window",
    "tokio",
    "wayland",
    "wgpu",
    "winit",
] }
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
zbus = { version = "5.14.0", default-features = false, features = ["tokio", "p2p"] }

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"

# Same pins as cosmic-applets epoch-1.8.0, to match the installed panel.
[patch."https://github.com/smithay/client-toolkit.git"]
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

[patch."https://github.com/pop-os/cosmic-protocols"]
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "32283d7" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "32283d7" }
